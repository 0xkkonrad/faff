name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: |
          python3 -m http.server 8777 --directory web > /tmp/faff-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8777/index.html > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:browser
          npm run test:sounds
          FAFF_BROWSER=webkit npm run test:sounds
          FAFF_BROWSER=webkit node tests/browser-regressions.cjs
      - run: npm run test:pwa
      - run: npm run test:rebrand
      - run: FAFF_BROWSER=webkit npm run test:rebrand
