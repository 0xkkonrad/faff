<!doctype html>
<html lang="en" data-waffle-app>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff5dc">
  <meta name="description" content="Plan and track your focus and waffle sessions.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Waffle">
  <title>Waffle</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./calendar.css">
  <link rel="stylesheet" href="./responsive.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="waffle-screen" id="waffle-app" aria-label="Waffle">
    <div class="loading-screen"><img src="./logo.svg" alt="Waffle" width="72" height="72"><p>loading…</p></div>
  </div>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <div id="session-status" class="sr-only" role="status"></div>
  <noscript>Waffle needs JavaScript to run its timer.</noscript>
</body>
</html>
